<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Preconnect speeds up the Google Fonts handshake before the CSS request fires. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Space Grotesk is registered as the default `sans` font in
         tailwind.config.js; this is the actual font file load. Weights
         400/500/600/700 cover body copy, labels, and headings without
         shipping the whole family. Permanent Marker is registered as the
         `hand` font, used only for the header's name and the intro quote. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Permanent+Marker&display=swap"
      rel="stylesheet"
    />
    <title>MD. Fazle Rabbi Riyad — Backend Engineer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
