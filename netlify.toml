# netlify.toml — build + deploy settings for Netlify.
# Build with Vite, publish the `dist` folder, and deploy the serverless
# function(s) in netlify/functions (the contact form's email sender).
[build]
  command = "npm run build"
  publish = "dist"

# Netlify's secret scanner fails the build if a secret variable's value
# appears in the repo or build output. GMAIL_USER and CONTACT_TO are just
# email addresses, and CONTACT_TO is intentionally public (it's on the
# site). ADMIN_USERNAME is an identifier, not a credential. Passwords stay
# scanned so an actual credential accidentally committed to the repo fails.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "GMAIL_USER,CONTACT_TO,ADMIN_USERNAME"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Single-page app: serve index.html for client-side routes like /lets-talk
# so a refresh or a direct link doesn't 404. Function paths (/api/contact)
# are matched before this rule.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
